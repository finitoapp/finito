name: E2E PR

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.issue.number || github.event.inputs.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare-pr:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/e2e')
    runs-on: ubuntu-latest
    outputs:
      head_ref: ${{ steps.pr.outputs.head_ref }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - name: Read pull request metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_repo", pr.head.repo.full_name);
            core.setOutput("pr_number", String(pr.number));

  e2e-from-comment:
    needs: prepare-pr
    if: needs.prepare-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare-pr.outputs.head_repo }}
          ref: ${{ needs.prepare-pr.outputs.head_sha }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pr-${{ needs.prepare-pr.outputs.pr_number }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  e2e-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E
        run: bun run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-manual-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
