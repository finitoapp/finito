name: Vercel Preview Deployment

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  prepare-pr:
    if: >
      github.event.issue.pull_request &&
      contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/preview')
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_repo: ${{ steps.pr.outputs.head_repo }}
    steps:
      - name: Read pull request metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_repo", pr.head.repo.full_name);

  Deploy-Preview:
    needs: prepare-pr
    if: needs.prepare-pr.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare-pr.outputs.head_repo }}
          ref: ${{ needs.prepare-pr.outputs.head_sha }}

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Declare some variables
        run: |
          echo "NEXT_PUBLIC_GIT_COMMIT=$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

#      - name: Pull Vercel Environment Information
#        run: bun vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
#
#      - name: Build Project Artifacts
#        run: bun vercel build --token=${{ secrets.VERCEL_TOKEN }}
#
#      - name: Deploy Project Artifacts to Vercel
#        run: bun vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Netlify
        id: netlify_deploy
        run: |
          bunx netlify deploy \
            --dir out \
            --no-build \
            --site ${{ secrets.NETLIFY_SITE_ID }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }}
