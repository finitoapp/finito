name: Release

# A v<version> tag, pushed by `bun run release` on the commit that set that
# version, ships it for both brands: the PWAs by moving the `production`
# branch, which the `payky` and `finito` Vercel projects deploy to payky.me and
# app.finito.fit, and both Android apps to Google Play and one GitHub release.
# See docs/releases.md.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Bun Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the tag to match package.json
        run: |
          version="$(jq -r .version package.json)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on the commit that set version ${version}; cut releases with bun run release."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

  web:
    name: Ship the PWAs to payky.me and app.finito.fit
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Forced, because a hotfix tag is not an ancestor of the next release.
      - name: Move the production branch to the release
        run: git push --force origin HEAD:refs/heads/production

  android:
    name: Ship Payky's Android app
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > payky-release.keystore

      - name: Build release Android app
        env:
          PAYKY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAYKY_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAYKY_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun run cap:android:sync
          bun run cap build android --androidreleasetype APK --signing-type apksigner --keystorepath ../../../payky-release.keystore --keystorepass "${PAYKY_ANDROID_KEYSTORE_PASSWORD}" --keystorealias "${PAYKY_ANDROID_KEY_ALIAS}" --keystorealiaspass "${PAYKY_ANDROID_KEY_PASSWORD}"
          bun run cap build android --androidreleasetype AAB --keystorepath ../../../payky-release.keystore --keystorepass "${PAYKY_ANDROID_KEYSTORE_PASSWORD}" --keystorealias "${PAYKY_ANDROID_KEY_ALIAS}" --keystorealiaspass "${PAYKY_ANDROID_KEY_PASSWORD}"

      # Before Google Play, so a failed upload does not hold back the APK.
      - name: Keep the APK for the GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: payky-apk
          # One file, not a glob: upload-artifact keeps a glob's path below its
          # wildcard, and `github-release` reads the APK at the artifact's root.
          path: apps/native-shell/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error

      - name: Upload to Google Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: me.payky
          releaseFiles: apps/native-shell/android/app/build/outputs/bundle/**/*-signed.aab
          tracks: internal
          status: completed

  finito-android:
    name: Ship Finito's Android app
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}" >> "${GITHUB_PATH}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Without it the build would fall back to the debug key
      # (apps/native-app/plugins/with-release-signing.cjs).
      - name: Decode release keystore
        env:
          FINITO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FINITO_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${FINITO_ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::FINITO_ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "${FINITO_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/finito-release.keystore"

      - name: Build release Android app
        working-directory: apps/native-app
        env:
          ORG_GRADLE_PROJECT_finitoReleaseStorePassword: ${{ secrets.FINITO_ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_finitoReleaseKeyAlias: ${{ secrets.FINITO_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_finitoReleaseKeyPassword: ${{ secrets.FINITO_ANDROID_KEY_PASSWORD }}
          # No Sentry auth token: the build uploads no source maps.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          export ORG_GRADLE_PROJECT_finitoReleaseStoreFile="${RUNNER_TEMP}/finito-release.keystore"
          bun x expo prebuild --platform android --no-install
          cd android
          ./gradlew bundleRelease

      # One APK for arm64-v8a, made from the AAB Google Play gets: bundletool's
      # system mode is the one that fuses a bundle into a single APK for one
      # device spec (universal mode keeps every ABI, ~200 MB). The spec's
      # sdkVersion is Finito's minSdk; its density is the highest, so other
      # screens scale down; its locales are the app's languages. Native
      # libraries stay uncompressed, as Gradle's own APK had them.
      # Its name is the one the Finito landing links (apps/landing/src/core/landing-sites.ts).
      - name: Build the arm64-v8a APK from the AAB and check its signer
        working-directory: apps/native-app/android/app/build/outputs
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
          KS_PASS: ${{ secrets.FINITO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINITO_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.FINITO_ANDROID_KEY_PASSWORD }}
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  ${RUNNER_TEMP}/bundletool.jar" | sha256sum --check --status
          printf '%s' '{"supportedAbis":["arm64-v8a"],"supportedLocales":["en","cs","sk"],"screenDensity":640,"sdkVersion":24}' \
            > "${RUNNER_TEMP}/device-spec.json"
          java -jar "${RUNNER_TEMP}/bundletool.jar" build-apks \
            --bundle=bundle/release/app-release.aab \
            --output="${RUNNER_TEMP}/finito.apks" \
            --mode=system \
            --device-spec="${RUNNER_TEMP}/device-spec.json" \
            --system-apk-options=UNCOMPRESSED_NATIVE_LIBRARIES \
            --ks="${RUNNER_TEMP}/finito-release.keystore" \
            --ks-pass="pass:${KS_PASS}" \
            --ks-key-alias="${KEY_ALIAS}" \
            --key-pass="pass:${KEY_PASS}"
          unzip -p "${RUNNER_TEMP}/finito.apks" system/system.apk > finito-release-signed.apk
          if apksigner verify --print-certs finito-release-signed.apk | grep -q "CN=Android Debug"; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi

      # Before Google Play, so a failed upload does not hold back the APK.
      - name: Keep the APK for the GitHub release
        uses: actions/upload-artifact@v4
        with:
          name: finito-apk
          path: apps/native-app/android/app/build/outputs/finito-release-signed.apk
          if-no-files-found: error

      # For uploading to Google Play by hand while the upload below is off;
      # a run artifact, not a release asset, so nobody installs it by mistake.
      - name: Keep the AAB for Google Play
        uses: actions/upload-artifact@v4
        with:
          name: finito-aab
          path: apps/native-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Off until the Google Play service account may release fit.finito.app:
      # v26.11.1's upload failed with "The caller does not have permission".
      # Until then Finito ships through the GitHub release's APK only.
      # - name: Upload to Google Play internal track
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: fit.finito.app
      #     releaseFiles: apps/native-app/android/app/build/outputs/bundle/release/app-release.aab
      #     tracks: internal
      #     status: completed

  github-release:
    name: Publish the GitHub release
    needs: [android, finito-android]
    # Once both APKs are built, even when a Google Play upload failed: the
    # landings link releases/latest, so a release must carry both.
    if: ${{ !cancelled() && needs.android.result != 'skipped' && needs.finito-android.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: "*-apk"
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Payky / Finito ${{ github.ref_name }}
          generate_release_notes: true
          # Only the signed APKs, under the names the landings link as
          # releases/latest/download/<name> (landing/0005).
          files: |
            apks/app-release-signed.apk
            apks/finito-release-signed.apk
          fail_on_unmatched_files: true
