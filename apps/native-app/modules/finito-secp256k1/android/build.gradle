plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'fit.finito.secp256k1'
version = '1.0.0'

android {
  namespace "fit.finito.secp256k1"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bitcoin Core's libsecp256k1, built for every Android ABI by ACINQ.
  implementation 'fr.acinq.secp256k1:secp256k1-kmp-jni-android:0.24.0'
}
