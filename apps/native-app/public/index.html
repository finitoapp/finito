<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- web-app's index.html head: icons, manifest, canonical and the installed-app metadata. -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Every route serves this file; the landing page on finito.fit is the one to index (landing/0001). -->
    <link rel="canonical" href="https://finito.fit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The system bar in the theme's background (src/theme/themes.ts) until
         the app sets the chosen theme's (src/platform/browser-theme-color.web.ts). -->
    <meta name="theme-color" content="#eff0f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Finito" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Finito</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* An installed web app fills the whole screen, under the
         black-translucent status bar too. iOS 26 sizes 100% (and dvh, svh,
         innerHeight) short of it by the status bar in that mode (WebKit
         301108), leaving a strip at the bottom, while older iOS sizes it
         right; only lvh is the full screen in both. Adding the top inset to
         100% instead overshot every iOS that has no such bug, cutting the
         bottom of the page off (the menu bar on an iPhone SE). The class
         comes from the script below, as iOS does not always match
         `display-mode: standalone`. */
      html.standalone,
      html.standalone body {
        height: 100lvh;
        overflow: hidden;
      }
    </style>
    <script>
      if (
        navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches
      ) {
        document.documentElement.classList.add("standalone")
      }
    </script>
    <style>
      /* The theme's background (src/theme/themes.ts) before the app
         paints, so a dark device does not flash white while the bundle
         loads. */
      html,
      body {
        margin: 0;
        background: #eff0f1;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0a0b0d;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
  </body>
</html>
