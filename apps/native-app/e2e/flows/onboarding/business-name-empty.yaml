# web onboarding.spec.ts: "business name publication during onboarding:
# empty". A blank name publishes nothing; the mock relay would refuse a blank
# profile, which would hold onboarding on its failure message.
appId: ${APP_ID}
tags: [onboarding]
---
- runFlow: ../../subflows/start.yaml
- tapOn: ${output.t["onboarding.welcome.new"]}
- assertVisible: ${output.t["onboarding.setup.title"]}
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      LABEL: ${output.t["onboarding.setup.name.label"]}
      VALUE: "   "
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow: ../../subflows/sell-and-finish.yaml
- extendedWaitUntil:
    visible: ${output.t["home.pay"]}
    timeout: 30000
