# web onboarding.spec.ts: "business name publication during onboarding:
# skip". The mock relay always refuses "Café Skip". Not checked: that the
# relay saw exactly one attempt (a flow cannot read the mock).
appId: ${APP_ID}
tags: [onboarding]
---
- runFlow: ../../subflows/start.yaml
- tapOn: ${output.t["onboarding.welcome.new"]}
- assertVisible: ${output.t["onboarding.setup.title"]}
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      LABEL: ${output.t["onboarding.setup.name.label"]}
      VALUE: " Café Skip "
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow: ../../subflows/sell-and-finish.yaml
- extendedWaitUntil:
    visible: ${output.t["onboarding.businessName.publishFailed.title"]}
    timeout: 30000
- assertVisible: ${output.t["onboarding.selling.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["onboarding.businessName.continueWithoutPublishing"]}
- extendedWaitUntil:
    visible: ${output.t["home.pay"]}
    timeout: 30000
