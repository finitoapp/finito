# web bill.spec.ts: "decrements a saved item after its catalog snapshot
# changes".
appId: ${APP_ID}
tags: [bill]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "5"
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow: ../../subflows/start-new-bill.yaml
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.add.aria", { name: "Coffee" })}'
- assertVisible: '${output.tv("bill.itemsCount", { value: 1 })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- extendedWaitUntil:
    visible:
      id: no-table-tile
    timeout: 10000
# Edit the catalog price.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/items
      TEXT: ${output.t["catalog.items.title"]}
- tapOn: Coffee
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- runFlow:
    file: ../../subflows/fill-inline.yaml
    env:
      LABEL: ${output.t["catalog.items.form.price.label"]}
      VALUE: "6"
# Resume the cart and remove its old snapshot.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["bill.table.dialog.none"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("bill.list.label", { number: "\\d+" })}'
- extendedWaitUntil:
    visible: '${output.tv("bill.itemsCount", { value: 1 })}'
    timeout: 10000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.remove.aria", { name: "Coffee" })}'
- assertVisible: '${output.tv("bill.itemsCount", { value: 0 })}'
