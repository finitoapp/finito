# web bill.spec.ts: "a link with an id that can't be parsed shows an
# invalid-id page with a way home, not the error boundary".
appId: ${APP_ID}
tags: [bill]
---
- runFlow: ../../subflows/seed-onboarding.yaml
# A malformed bill link.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: bill?billId=not-a-bill-id
      TEXT: ${output.t["bill.invalidId"]}
- assertNotVisible: ${output.t["appError.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.menu"]}
# A malformed payment link.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: payment/not-a-payment-id
      TEXT: ${output.t["paymentWait.invalidId"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.menu"]}
# A malformed tableId only costs the table preselection.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: bill?tableId=not-a-table-id
      TEXT: ${output.t["bill.title"]}
- assertVisible: ${output.t["bill.table.assign"]}
