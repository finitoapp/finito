# web cashu.spec.ts: "the mints screen lists the default mint with its
# balance" (the fake mint is the in-app one, e2e-cashu-mint.ts).
appId: ${APP_ID}
tags: [cashu]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/enable-cashu.yaml
    env:
      MODE: manual
# The row opens only once the switch has taken.
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.bitcoin.enabled.label"]}
      CHECKED: "true"
# The row ignores a tap until the account behind the switch is written, and
# "Cashu" is its status text too, so wait for what only the page has.
- retry:
    maxRetries: 3
    commands:
      - tapOn: ${output.re(output.t["settings.paymentAccounts.method.bitcoin"])}
      - extendedWaitUntil:
          visible: ${output.re(output.t["settings.cashuAccount.mints"])}
          timeout: 5000
- tapOn: ${output.re(output.t["settings.cashuAccount.mints"])}
- extendedWaitUntil:
    visible: ${output.t["settings.cashuMints.title"]}
    timeout: 15000
- assertVisible: cashu.cz
- assertVisible: ${output.t["settings.cashuMints.default"]}
