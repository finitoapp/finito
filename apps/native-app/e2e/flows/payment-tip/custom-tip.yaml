# web payment-tip.spec.ts: "charge with a custom tip typed on its keypad".
appId: ${APP_ID}
tags: [payment-tip]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/to-tip-step.yaml
- tapOn: ${output.t["paymentTip.custom.label"]}
- extendedWaitUntil:
    visible: ${output.t["paymentTip.continue"]}
    timeout: 10000
- runFlow:
    file: ../../subflows/enter-amount.yaml
    env:
      AMOUNT: "2.5"
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentTip.continue"]}
- runFlow: ../../subflows/mark-cash-paid.yaml
