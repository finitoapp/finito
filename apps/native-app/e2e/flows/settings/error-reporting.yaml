# web settings-appearance.spec.ts: "toggle error reporting". The consent is
# a switch named after it; its state is checked on Android only (Maestro's
# web driver reports no checked state).
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/about/privacy
      TEXT: ${output.t["settings.about.privacy.title"]}
# Off by default (a device setting).
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.privacy.errorReporting.title"]}
      CHECKED: "false"
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.privacy.errorReporting.title"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.privacy.errorReporting.title"]}
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.privacy.errorReporting.title"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.privacy.errorReporting.title"]}
      CHECKED: "false"
