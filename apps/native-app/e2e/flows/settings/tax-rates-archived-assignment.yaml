# web settings-tax-rates.spec.ts: "an archived tax rate stays assigned to its
# item but is not offered for a new item".
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-tax-rate.yaml
    env:
      NAME: Standard rate
      RATE: "21"
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "59"
      TAX_RATE: Standard rate.*
# Archive the rate.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/tax-rates
      TEXT: ${output.t["settings.taxRates.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("settings.taxRates.archive", { name: "Standard rate" })}'
- tapOn: ${output.t["settings.taxRates.archive.confirm.confirm"]}
- extendedWaitUntil:
    visible: ${output.t["settings.taxRates.archived.title"]}
    timeout: 10000
# The item still shows it, marked as archived.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: catalog/items
      TEXT: ${output.t["catalog.items.title"]}
- tapOn: Coffee
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- scrollUntilVisible:
    element: Standard rate.*${output.re(output.t["settings.taxRates.archived.title"])}.*
    centerElement: true
# A new item does not offer it.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: catalog/items/new
      TEXT: ${output.t["catalog.items.form.title.create"]}
- scrollUntilVisible:
    element: ${output.t["catalog.items.form.taxRate.none"]}
    centerElement: true
- tapOn: ${output.t["catalog.items.form.taxRate.none"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.taxRate.label"]}
    timeout: 10000
- assertNotVisible: Standard rate.*
