# web recovery-backup.spec.ts: "the backup reminder waits for the first payment
# and Later puts it off" and "verifying the backup ends the reminder" (native
# shows no copy action; the check refuses a wrong word and accepts the right
# ones). The reminder is a notification (account/0009): a card on the
# Notifications tab and a dot on home's hamburger and on the tab
# (navigation/0005), each then named nav.notificationsUnread.
appId: ${APP_ID}
tags: [settings]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: unverifiedBackup=true
# Nothing is lit before the first payment.
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.menu"]}
- runFlow: ../../subflows/take-cash-payment.yaml
# After it home's hamburger lights up, and no dialog covers home.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.notificationsUnread"]}
- assertNotVisible: ${output.re(output.t["notifications.recoveryBackup.title"])}
# The Notifications tab holds the reminder's card, its tab lit in the bar.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: notifications
      TEXT: ${output.re(output.t["notifications.recoveryBackup.title"])}
- assertVisible: ${output.re(output.t["notifications.recoveryBackup.description"])}
- assertVisible: ${output.t["notifications.recoveryBackup.later"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.notificationsUnread"]}
# Security only reports the status.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/security
      TEXT: ${output.t["settings.security.title"]}
- assertVisible: ${output.t["settings.security.verify.status.unverified"]}
- assertNotVisible:
    id: recovery-word-1
- assertNotVisible: ${output.t["settings.security.mnemonic.copy"]}
- runFlow: ../../subflows/read-phrase.yaml
- tapOn: ${output.t["settings.security.backup.continue"]}
- assertVisible: ${output.t["settings.security.verify.title"]}
# The check names the three slots it asks for.
- copyTextFrom:
    text: "Type the words \\d+, \\d+, \\d+ from.*"
- evalScript: ${output.slots = /words (\d+), (\d+), (\d+)/.exec(maestro.copiedText).slice(1, 4).map(Number)}
# A wrong word is refused.
- runFlow:
    file: ../../subflows/verify-slots.yaml
    env:
      MODE: wrong
- hideKeyboard
- tapOn: ${output.t["settings.security.verify.submit"]}
- assertVisible: ${output.t["settings.security.verify.wrong"]}
# The right ones verify the backup and leave for Security.
- runFlow:
    file: ../../subflows/verify-slots.yaml
    env:
      MODE: right
- hideKeyboard
- tapOn: ${output.t["settings.security.verify.submit"]}
- extendedWaitUntil:
    visible: ${output.t["settings.security.title"]}
    timeout: 15000
- assertNotVisible: ${output.t["settings.security.verify.status.unverified"]}
# The reminder is over: the card gives way to the empty state, and neither
# the tab nor home's hamburger is lit.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: notifications
      TEXT: ${output.t["notifications.empty.title"]}
- assertNotVisible: ${output.re(output.t["notifications.recoveryBackup.title"])}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.notifications"]}
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.menu"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.notificationsUnread"]}
      HIDDEN: "true"
