# web recovery-backup.spec.ts: "the backup reminder waits for more than 10,000
# sats in the wallet, Later puts it off, and verifying the backup ends it"
# (native shows no copy action; the check refuses a wrong word and accepts the
# right ones).
appId: ${APP_ID}
tags: [settings]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: unverifiedBackup=true
# Nothing is shown before a payment, nor after a cash one: the wallets are empty.
- assertNotVisible:
    id: backup-reminder
- runFlow: ../../subflows/take-cash-payment.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- assertNotVisible:
    id: backup-reminder
# A Cashu payment of 200 (about 13,333 sats at the mocked rate) fills the
# wallet over 10,000 sats. The fake mint lives in the page, so from here on
# by taps only.
- runFlow: ../../subflows/enable-cashu.yaml
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/enter-amount.yaml
    env:
      AMOUNT: "200"
- tapOn: ${output.t["home.pay"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["paymentTip.none"])}
    timeout: 15000
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.method.bitcoin"]}
- extendedWaitUntil:
    visible: ${output.t["paymentWait.paid"]}
    timeout: 45000
# Back home, the reminder opens once the wallet balance is in.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.back"]}
- extendedWaitUntil:
    visible:
      id: backup-reminder
    timeout: 15000
- tapOn: ${output.t["settings.security.reminder.later"]}
- assertNotVisible:
    id: backup-reminder
# Security only reports the status.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/security
      TEXT: ${output.t["settings.security.title"]}
- assertVisible: ${output.t["settings.security.verify.status.unverified"]}
- assertNotVisible:
    id: recovery-word-1
- assertNotVisible: ${output.t["settings.security.mnemonic.copy"]}
- runFlow: ../../subflows/read-phrase.yaml
- tapOn: ${output.t["settings.security.backup.continue"]}
- assertVisible: ${output.t["settings.security.verify.title"]}
# The check names the three slots it asks for.
- copyTextFrom:
    text: "Type the words \\d+, \\d+, \\d+ from.*"
- evalScript: ${output.slots = /words (\d+), (\d+), (\d+)/.exec(maestro.copiedText).slice(1, 4).map(Number)}
# A wrong word is refused.
- runFlow:
    file: ../../subflows/verify-slots.yaml
    env:
      MODE: wrong
- hideKeyboard
- tapOn: ${output.t["settings.security.verify.submit"]}
- assertVisible: ${output.t["settings.security.verify.wrong"]}
# The right ones verify the backup and leave for Security.
- runFlow:
    file: ../../subflows/verify-slots.yaml
    env:
      MODE: right
- hideKeyboard
- tapOn: ${output.t["settings.security.verify.submit"]}
- extendedWaitUntil:
    visible: ${output.t["settings.security.title"]}
    timeout: 15000
- assertNotVisible: ${output.t["settings.security.verify.status.unverified"]}
