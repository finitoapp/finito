# web settings-tax-rates.spec.ts: "clearing an item's tax rate assignment".
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-tax-rate.yaml
    env:
      NAME: Standard rate
      RATE: "21"
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "59"
      TAX_RATE: Standard rate.*
# Clear it back to no tax rate; the select saves on its own.
- tapOn: Coffee
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- scrollUntilVisible:
    element: Standard rate.*
    centerElement: true
- tapOn: Standard rate.*
- tapOn: ${output.t["catalog.items.form.taxRate.none"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.taxRate.none"]}
    timeout: 10000
# The cleared assignment survives a restart.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: catalog/items
      TEXT: ${output.t["catalog.items.title"]}
- tapOn: Coffee
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- scrollUntilVisible:
    element: ${output.t["catalog.items.form.taxRate.none"]}
    centerElement: true
