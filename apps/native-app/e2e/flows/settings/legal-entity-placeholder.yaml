# web settings-legal-entity.spec.ts: "requires a country before saving, and
# shows a placeholder for an account that never configured it". The disabled
# VAT-payer checkbox is checked on Android only (Maestro's web driver reports
# no enabled state).
# The business fields live on the profile screen (Finito).
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/profile
      TEXT: ${output.t["settings.profile.npub.label"]}
# The placeholder sits inside the country select.
- assertVisible:
    text: ${output.re(output.t["settings.legalEntity.country.placeholder"])}
    childOf:
      id: ${output.re(output.t["settings.legalEntity.country.label"])}
# The VAT-payer choice waits for a country.
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: ${output.re(output.t["settings.profile.vatPayer"])}
          enabled: false
