# web settings-misc.spec.ts: "switch the default fiat currency". The select
# sits on the profile screen and reads as the currency's sign ("$"); the
# sheet names each currency.
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/profile
      TEXT: ${output.t["settings.profile.npub.label"]}
- tapOn: ${output.t["settings.fiat.usd.symbol"]}
- tapOn: ${output.t["settings.fiat.czk.title"]}
- extendedWaitUntil:
    visible: ${output.t["settings.fiat.czk.symbol"]}
    timeout: 10000
# The choice survives a restart.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: settings/profile
      TEXT: ${output.t["settings.profile.npub.label"]}
- assertVisible: ${output.t["settings.fiat.czk.symbol"]}
