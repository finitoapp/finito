# web settings-accounts.spec.ts: "create, switch, and remove a device
# account". Rows are read by position: the first-created account comes first.
appId: ${APP_ID}
tags: [settings]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/accounts
      TEXT: ${output.t["settings.accounts.title"]}
# Create a second account and onboard it.
- scrollUntilVisible:
    element: ${output.t["onboarding.welcome.new"]}
- tapOn: ${output.t["onboarding.welcome.new"]}
- tapOn: ${output.t["settings.accounts.create.confirm.confirm"]}
- extendedWaitUntil:
    visible: ${output.t["onboarding.welcome.new"]}
    timeout: 30000
- runFlow: ../../subflows/complete-onboarding.yaml
# Both are listed, the new one active.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/accounts
      TEXT: ${output.t["settings.accounts.title"]}
- assertVisible:
    text: ${output.t["settings.accounts.list.switch"]}
    above: ${output.t["settings.accounts.list.active"]}
# Switch back to the first-created account; the list stays open.
- tapOn: ${output.t["settings.accounts.list.switch"]}
- extendedWaitUntil:
    visible:
      text: ${output.t["settings.accounts.list.active"]}
      above: ${output.t["settings.accounts.list.switch"]}
    timeout: 30000
# Cancelling the removal keeps the second account.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["settings.accounts.list.remove"]}
- tapOn: ${output.t["settings.accounts.remove.confirm.cancel"]}
- assertVisible: ${output.t["settings.accounts.list.switch"]}
# Removing it after confirming leaves one account.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["settings.accounts.list.remove"]}
- tapOn: ${output.t["settings.accounts.remove.confirm.confirm"]}
- extendedWaitUntil:
    notVisible: ${output.t["settings.accounts.list.switch"]}
    timeout: 10000
- assertVisible: ${output.t["settings.accounts.list.active"]}
