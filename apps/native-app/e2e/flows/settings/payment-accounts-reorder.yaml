# web settings-payment-accounts.spec.ts: "reorder payment methods and let the
# first available one be the default". Row order and the Default badge are
# read by position (above/below a method's name); the switch state is checked
# on Android only. Android only as a whole: a row is moved by dragging its
# grip, and Maestro's web driver cannot drag from an element (a `from` swipe
# only scrolls the window there, and the conventions rule out coordinates).
appId: ${APP_ID}
tags: [settings, android-only]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/payment-accounts
      TEXT: ${output.t["settings.paymentAccounts.title"]}
# The seed's default, cash, leads the list.
- assertVisible:
    text: ${output.t["settings.paymentAccounts.method.cashRegister"]}
    above: ${output.t["settings.paymentAccounts.method.iban"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.iban"]}
# Drag the bank transfer to the top: it becomes the default. The swipe starts
# on the row's grip and ends near the top of the screen, past the first row,
# so the row lands first wherever the list sits.
- swipe:
    from:
      text: '${output.re(output.tv("settings.paymentAccounts.reorder.aria", { name: output.t["settings.paymentAccounts.method.iban"] }))}'
    direction: UP
    duration: 800
- extendedWaitUntil:
    visible:
      text: ${output.t["settings.paymentAccounts.method.iban"]}
      above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
    timeout: 10000
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
# Turning it off hands the default to the next available method.
- runFlow:
    file: ../../subflows/tap-id.yaml
    env:
      LABEL: ${output.t["settings.fiatBankAccount.enabled.label"]}
- extendedWaitUntil:
    visible:
      text: ${output.t["settings.paymentAccounts.default"]}
      below: ${output.t["settings.paymentAccounts.method.iban"]}
    timeout: 10000
- assertNotVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
# The order and the disabled method survive a restart.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: settings/payment-accounts
      TEXT: ${output.t["settings.paymentAccounts.title"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.method.iban"]}
    above: ${output.t["settings.paymentAccounts.method.cashRegister"]}
- assertVisible:
    text: ${output.t["settings.paymentAccounts.default"]}
    below: ${output.t["settings.paymentAccounts.method.iban"]}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.fiatBankAccount.enabled.label"]}
      CHECKED: "false"
