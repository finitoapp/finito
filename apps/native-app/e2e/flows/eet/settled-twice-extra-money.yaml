# web eet.spec.ts: "a payment settled twice reports the extra money, and
# refunding it reverses only that".
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow: ../../subflows/enable-eet.yaml
# A cash payment is also settled by a bank transfer.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.t["home.pay"]}
- runFlow: ../../subflows/to-tip-step.yaml
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow: ../../subflows/prepare-iban-payment.yaml
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow: ../../subflows/read-ids.yaml
- runFlow:
    file: ../../subflows/e2e-action.yaml
    env:
      ACTION: simulateDuplicateSettlement
      QUERY: paymentId=${output.paymentId}
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?count=2
# The payment detail shows the sale and the extra money sale, both confirmed.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- scrollUntilVisible:
    element: ${output.re(output.t["paymentDetail.eet.extra.description"])}
    # The extra sale's row can take longer than the default 20 s to show
    # under parallel runs.
    timeout: 45000
- extendedWaitUntil:
    visible: ${output.t["eet.status.confirmed"]}
    timeout: 20000
- assertNotVisible: ${output.t["eet.status.pending"]}
# The refund offers the extra money and reverses only it.
- runFlow:
    file: ../../subflows/scroll-to-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: ${output.t["refund.page.choice.overpayment"]}
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: ${output.re(output.t["refund.dialog.amount.label"])}
      text: "6"
    timeout: 10000
- tapOn: ${output.t["refund.dialog.method.outside"]}
- extendedWaitUntil:
    visible:
      id: ${output.re(output.t["refund.dialog.amount.label"])}
      text: "5\\.9"
    timeout: 10000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.+" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?count=3&lastNegates=1
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
# The history shows the overpayment returned.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity
      TEXT: ${output.t["activity.title"]}
- assertVisible: '${output.re(output.t["refund.state.overpayment"].split("{amount}")[0])}.+'
