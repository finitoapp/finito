# web eet.spec.ts: "a refunded tip reaches EET only while tips belong to the
# business". What reaches EET is read off the mock, as web does.
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow: ../../subflows/enable-eet.yaml
# A tip that belongs to the business is reversed.
- runFlow: ../../subflows/eet-pay-with-tip.yaml
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=7.00
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
# A part leaves the tip out, which has a choice of its own.
- extendedWaitUntil:
    visible: ${output.t["refund.page.choice.part"]}
    timeout: 10000
- tapOn: ${output.t["refund.page.choice.part"]}
- extendedWaitUntil:
    visible: '${output.tv("refund.dialog.tipHint", { amount: "CZK.1" })}'
    timeout: 10000
- tapOn: ${output.t["refund.page.choice.tip"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.1" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.tipCreated"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=7.00,-1.00
- assertVisible: '${output.re(output.t["paymentDetail.refunds.tip"])} · .*'
# The tip is refunded once: the screen no longer offers it.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: ${output.t["refund.page.choice.part"]}
    timeout: 10000
- assertNotVisible: ${output.t["refund.page.choice.tip"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
# A tip that belongs to employees is not reversed.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/eet
      TEXT: ${output.t["settings.eet.title"]}
- scrollUntilVisible:
    element: ${output.re(output.t["settings.eet.tip.employees.title"])}
- tapOn: ${output.re(output.t["settings.eet.tip.employees.title"])}
- runFlow:
    file: ../../subflows/assert-checked.yaml
    env:
      LABEL: ${output.t["settings.eet.tip.employees.title"]}
      BY_TEXT: "true"
- runFlow: ../../subflows/eet-pay-with-tip.yaml
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=7.00,-1.00,6.00
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: ${output.t["refund.page.choice.tip"]}
    timeout: 10000
- tapOn: ${output.t["refund.page.choice.tip"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.1" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.tipCreated"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: ${output.t["refund.dialog.method.outside"]}
    timeout: 10000
- tapOn: ${output.t["refund.dialog.method.outside"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.+" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
# Only the goods are reversed: the tip refund never reached EET.
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=7.00,-1.00,6.00,-6.00
