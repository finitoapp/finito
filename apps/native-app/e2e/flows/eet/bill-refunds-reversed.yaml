# web eet.spec.ts: "refunds of a paid bill reach EET as negative sales". The
# reversals are read off the mock, then both reversal cards must show
# Confirmed (Maestro has no "within": each status is the badge right of its
# card's title).
appId: ${APP_ID}
tags: [eet]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: fiatCurrency=CZK
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/reset
- runFlow: ../../subflows/enable-eet.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Beer
      PRICE: "50"
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Goulash
      PRICE: "150"
# A bill of 2 beers and a goulash is paid in cash.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: ""
      TEXT: ${output.re(output.t["home.pay"])}|${output.re(output.t["bill.table.dialog.none"])}
- runFlow: ../../subflows/start-new-bill.yaml
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.add.aria", { name: "Beer" })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.add.aria", { name: "Beer" })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("bill.brick.add.aria", { name: "Goulash" })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["home.pay"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["paymentTip.none"])}
    timeout: 15000
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow: ../../subflows/read-ids.yaml
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=250.00
# One beer is refunded and reversed.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible: ${output.t["refund.page.choice.part"]}
    timeout: 10000
- tapOn: ${output.t["refund.page.choice.part"]}
- tapOn: ${output.t["refund.dialog.mode.items"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("refund.dialog.items.increase", { name: "Beer" })}'
- runFlow:
    file: ../../subflows/scroll-to-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.50" })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.50" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=250.00,-50.00
# The rest is refunded and reversed, the whole payment the screen starts on.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
- runFlow:
    file: ../../subflows/scroll-to-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.200" })}'
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.tv("refund.dialog.confirm", { amount: "CZK.200" })}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/eet-mock.yaml
    env:
      PATH: /__mock/eet/expect?amounts=250.00,-50.00,-200.00
- assertNotVisible: ${output.t["paymentDetail.refunds.action"]}
- extendedWaitUntil:
    visible:
      text: ${output.t["eet.status.confirmed"]}
      rightOf: '${output.tv("paymentDetail.eet.reversal.title", { amount: ".CZK.50" })}'
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ${output.t["eet.status.confirmed"]}
      rightOf: '${output.tv("paymentDetail.eet.reversal.title", { amount: ".CZK.200" })}'
    timeout: 20000
# The payment shows refunded while its bill stays closed.
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/bills/${output.billId}
      TEXT: ${output.t["billDetail.title"]}
- assertVisible: ${output.t["bill.status.closed"]}
- assertVisible: '${output.tv("refund.state.full", { amount: "CZK.250" })}'
