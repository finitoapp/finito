# web access.spec.ts: "a refund raises the one-shot PIN prompt naming the
# permission it needs". Finito asks when the refund screen opens, its route
# needing `refund` (docs/plans/refund-flow.md); web follows in the plan's
# Phase 3.
appId: ${APP_ID}
tags: [access]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/enter-amount.yaml
    env:
      AMOUNT: "5"
- tapOn: ${output.t["home.pay"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["paymentTip.none"])}
    timeout: 15000
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow: ../../subflows/read-ids.yaml
- runFlow: ../../subflows/turn-on-access.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity/${output.paymentId}
      TEXT: ${output.t["paymentDetail.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentDetail.refunds.action"]}
# The screen's lock names the permission it needs.
- extendedWaitUntil:
    visible: '${output.tv("access.pin.why.route", { permission: output.t["access.permission.refund"] })}'
    timeout: 15000
- runFlow:
    file: ../../subflows/type-pin.yaml
    env:
      PIN: "4821"
- extendedWaitUntil:
    visible: ${output.t["refund.dialog.method.label"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      PATTERN: '${output.re(output.tv("refund.dialog.confirm", { amount: "\u00245" }))}'
- extendedWaitUntil:
    visible: ${output.t["refund.created"]}
    timeout: 15000
