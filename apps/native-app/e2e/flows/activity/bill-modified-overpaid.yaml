# web activity.spec.ts: "the payment detail shows the bill's coverage as overpaid when another device edits it mid-payment (removeAll)".
appId: ${APP_ID}
tags: [activity]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/begin-coffee-payment.yaml
- runFlow:
    file: ../../subflows/e2e-action.yaml
    env:
      ACTION: simulateBillModifiedDuringPayment
      QUERY: billId=${output.billId}&mode=removeAll
- runFlow:
    file: ../../subflows/reopen-payment.yaml
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow: ../../subflows/open-paid-detail.yaml
- assertVisible: '${output.re(output.tv("overpayment.title", { amount: "\u00245" }))}'
- scrollUntilVisible:
    element: ${output.t["paymentDetail.bill.coverage.changesTitle"]}
- scrollUntilVisible:
    element: "− 1 × Coffee"
