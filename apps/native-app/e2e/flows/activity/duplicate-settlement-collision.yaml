# web activity.spec.ts: "a duplicate-settlement payment collision is flagged in the payment detail and can be resolved".
appId: ${APP_ID}
tags: [activity]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/to-tip-step.yaml
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow: ../../subflows/prepare-iban-payment.yaml
- runFlow: ../../subflows/mark-cash-paid.yaml
- runFlow: ../../subflows/read-ids.yaml
- runFlow:
    file: ../../subflows/e2e-action.yaml
    env:
      ACTION: simulateDuplicateSettlement
      QUERY: paymentId=${output.paymentId}
- runFlow:
    file: ../../subflows/reopen-payment.yaml
    env:
      TEXT: ${output.t["paymentDetail.title"]}
- extendedWaitUntil:
    visible: '${output.re(output.tv("overpayment.title", { amount: "\u00245.90" }))}'
    timeout: 15000
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["overpayment.action.keep"]}
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      LABEL: ${output.t["overpayment.dialog.amount"]}
      VALUE: "5.9"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: '${output.tv("overpayment.dialog.confirm.keep", { amount: "\u00245.90" })}'
- extendedWaitUntil:
    visible: ${output.t["overpayment.resolved.title"]}
    timeout: 15000
