# web withdraw.spec.ts: "confirming a withdrawal asks for the PIN even during a
# PIN session". The invoice and the funded fake wallet come first: a link
# reloads the web app and would end the session the wizard starts, so from
# turning access on everything runs in-app.
appId: ${APP_ID}
tags: [withdraw]
---
- runFlow:
    file: ../../subflows/seed-onboarding.yaml
    env:
      QUERY: spark=true
- runFlow: ../../subflows/read-invoice.yaml
# `next=/` replaces the bridge page, so there is no "E2E OK" to wait for.
- openLink: ${BASE_URL}e2e/fake?spark=funded&next=/
- extendedWaitUntil:
    visible: ${output.t["home.pay"]}
    timeout: 15000
# Turn access control on from the settings list; the wizard leaves a PIN session.
- runFlow:
    file: ../../subflows/turn-on-access.yaml
    env:
      IN_APP: "true"
      KEEP: "true"
# Walk to a new withdrawal inside the session.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/open-settings-entry.yaml
    env:
      TITLE: ${output.t["settings.paymentAccounts.title"]}
- tapOn: ${output.re(output.t["settings.paymentAccounts.method.bitcoin"])}
- scrollUntilVisible:
    element: ${output.t["settings.withdrawals.title"]}
- tapOn: ${output.t["settings.withdrawals.title"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["withdraw.history.new"]}
# Review a Lightning invoice.
- runFlow:
    file: ../../subflows/tap-input.yaml
    env:
      LABEL: ${output.t["withdraw.destination.label"]}
- inputText: ${output.invoice}
# On Android the keyboard covers Continue.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["withdraw.continue"]}
- extendedWaitUntil:
    visible: ${output.t["withdraw.review.title"]}
    timeout: 15000
# Going back keeps what was typed.
# The card's Back, not the header's (same copy).
- tapOn:
    text: ${output.re(output.t["withdraw.review.back"])}
    below: ${output.t["withdraw.review.title"]}
- assertVisible:
    id: ${output.re(output.t["withdraw.destination.label"])}
    text: ${output.invoice}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["withdraw.continue"]}
- extendedWaitUntil:
    visible: ${output.t["withdraw.review.title"]}
    timeout: 15000
# Confirming asks for the PIN although the session runs, naming the amount.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["withdraw.review.confirm"]}
- runFlow:
    file: ../../subflows/assert-prompt.yaml
    env:
      ACTION: ${output.t["access.action.withdraw"]}
- assertVisible:
    id: pin-prompt-detail
    text: .*1,000.*
- runFlow:
    file: ../../subflows/type-pin.yaml
    env:
      PIN: "4821"
# The withdrawal's detail opens.
- extendedWaitUntil:
    visible: ${output.t["withdraw.detail.pending.ownDevice"]}
    timeout: 30000
