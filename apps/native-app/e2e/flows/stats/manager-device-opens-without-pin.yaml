# web stats.spec.ts: "a Manager device opens the statistics without the PIN".
appId: ${APP_ID}
tags: [stats]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/turn-on-access.yaml
    env:
      PRESET: ${output.t["access.preset.manager"]}
# The statistics open from Activity's tabs (the app restarted, so the PIN
# session is gone).
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: activity
      TEXT: ${output.t["activity.title"]}
- tapOn: ${output.re(output.t["activity.tabs.stats"])}
# "Live" marks the statistics page itself.
- extendedWaitUntil:
    visible: ${output.t["stats.live"]}
    timeout: 15000
- assertNotVisible: '${output.tv("access.pin.why.route", { permission: output.t["access.permission.stats"] })}'
