# web catalog-items.spec.ts: "search matches internal name, SKU and scan
# code". Staff see the internal name, so the row carries it.
appId: ${APP_ID}
tags: [catalog]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "5"
      INTERNAL_NAME: Espresso Blend
      SKU: COF-001
      SCAN_CODE: "8594001234567"
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Tea
      PRICE: "3"
- evalScript: '${output.queries = ["Espresso", "COF-001", "8594001234567", "Coffee"]; output.queryIndex = 0}'
- repeat:
    times: 4
    commands:
      - runFlow:
          file: ../../subflows/fill-input.yaml
          env:
            LABEL: ${output.t["catalog.items.search"]}
            VALUE: ${output.queries[output.queryIndex]}
      - extendedWaitUntil:
          notVisible: Tea
          timeout: 10000
      - assertVisible: Espresso Blend
      - evalScript: ${output.queryIndex = output.queryIndex + 1}
