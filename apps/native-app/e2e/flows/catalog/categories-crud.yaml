# web catalog-categories.spec.ts: "create, edit and delete a catalog
# category".
appId: ${APP_ID}
tags: [catalog]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: catalog/categories
      TEXT: ${output.t["catalog.categories.title"]}
- assertVisible: ${output.t["catalog.categories.empty.title"]}
- runFlow:
    file: ../../subflows/add-category.yaml
    env:
      NAME: Drinks
- assertVisible: Drinks
# Edit its name.
- tapOn: Drinks
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.form.title.edit"]}
    timeout: 10000
- assertVisible:
    id: ${output.re(output.t["catalog.categories.form.name.label"])}
    text: Drinks
- runFlow:
    file: ../../subflows/fill-inline.yaml
    env:
      LABEL: ${output.t["catalog.categories.form.name.label"]}
      VALUE: Beverages
      PLACEHOLDER: ${output.t["catalog.categories.form.name.placeholder"]}
# The edit survives a restart.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: catalog/categories
      TEXT: ${output.t["catalog.categories.title"]}
- tapOn: Beverages
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.form.title.edit"]}
    timeout: 10000
- assertVisible:
    id: ${output.re(output.t["catalog.categories.form.name.label"])}
    text: Beverages
# Delete it; the list is empty again.
- scrollUntilVisible:
    element: ${output.t["catalog.categories.delete"]}
- tapOn: ${output.t["catalog.categories.delete"]}
- tapOn: ${output.t["catalog.categories.delete.confirm.confirm"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.empty.title"]}
    timeout: 10000
