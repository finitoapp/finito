# web catalog-categories.spec.ts: "search filters the categories list".
appId: ${APP_ID}
tags: [catalog]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-category.yaml
    env:
      NAME: Drinks
- runFlow:
    file: ../../subflows/add-category.yaml
    env:
      NAME: Snacks
# Typing filters the list.
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      LABEL: ${output.t["catalog.categories.search"]}
      VALUE: Dri
- extendedWaitUntil:
    notVisible: Snacks
    timeout: 10000
- assertVisible: Drinks
# No match shows the empty-search message.
- runFlow:
    file: ../../subflows/fill-input.yaml
    env:
      LABEL: ${output.t["catalog.categories.search"]}
      VALUE: nonexistent
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.emptySearch"]}
    timeout: 10000
# Clearing the search restores the full list.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["catalog.categories.search.clear.aria"]}
- extendedWaitUntil:
    visible: Snacks
    timeout: 10000
- assertVisible: Drinks
