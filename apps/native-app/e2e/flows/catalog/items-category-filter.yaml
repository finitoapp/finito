# web catalog-items.spec.ts: "filters the items list by category".
appId: ${APP_ID}
tags: [catalog]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "5"
      CATEGORY: Drinks
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Sandwich
      PRICE: "6"
- assertVisible: Coffee
- assertVisible: Sandwich
# The "Drinks" chip (the row's subtitle says Drinks too, so the chip is the
# one above the rows).
- tapOn:
    text: Drinks
    above: Coffee
- extendedWaitUntil:
    notVisible: Sandwich
    timeout: 10000
- assertVisible: Coffee
- tapOn: ${output.t["catalog.items.category.uncategorized"]}
- extendedWaitUntil:
    notVisible: Coffee
    timeout: 10000
- assertVisible: Sandwich
- tapOn: ${output.t["catalog.items.category.all"]}
- extendedWaitUntil:
    visible: Coffee
    timeout: 10000
- assertVisible: Sandwich
