# web catalog-items.spec.ts: "create, edit and delete a catalog item".
appId: ${APP_ID}
tags: [catalog]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/goto.yaml
    env:
      ROUTE: settings/items
      TEXT: ${output.t["catalog.items.title"]}
- assertVisible: ${output.t["catalog.items.empty.title"]}
- runFlow:
    file: ../../subflows/add-catalog-item.yaml
    env:
      NAME: Coffee
      PRICE: "59"
      SCAN_CODE: "8594001234567"
- assertVisible: Coffee
- assertVisible: .*59.*
# Edit its name and price.
- tapOn: Coffee
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- assertVisible:
    id: ${output.re(output.t["catalog.items.form.name.label"])}
    text: Coffee
- runFlow:
    file: ../../subflows/fill-inline.yaml
    env:
      LABEL: ${output.t["catalog.items.form.name.label"]}
      VALUE: Espresso
      PLACEHOLDER: ${output.t["catalog.items.form.name.placeholder"]}
- runFlow:
    file: ../../subflows/fill-inline.yaml
    env:
      LABEL: ${output.t["catalog.items.form.price.label"]}
      VALUE: "69"
# An optional field round-trips through set and not set.
- scrollUntilVisible:
    element:
      id: ${output.re(output.t["catalog.items.form.sku.label"])}
    centerElement: true
- runFlow:
    file: ../../subflows/fill-inline.yaml
    env:
      LABEL: ${output.t["catalog.items.form.sku.label"]}
      VALUE: COF-001
      PLACEHOLDER: ${output.t["catalog.items.form.sku.placeholder"]}
- runFlow:
    file: ../../subflows/tap-input.yaml
    env:
      LABEL: ${output.t["catalog.items.form.sku.label"]}
- runFlow:
    file: ../../subflows/clear-input.yaml
    env:
      LABEL: ${output.t["catalog.items.form.sku.label"]}
      PLACEHOLDER: ${output.t["catalog.items.form.sku.placeholder"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["inlineEdit.save"]}
- extendedWaitUntil:
    visible: ${output.re(output.t["inlineEdit.saved"])}
    timeout: 15000
# The currency select saves as soon as it is picked.
- scrollUntilVisible:
    element: USD
    centerElement: true
- tapOn: USD
- tapOn: EUR
- extendedWaitUntil:
    visible: EUR
    timeout: 10000
# The scan button is still reachable next to its field.
- scrollUntilVisible:
    element:
      id: ${output.re(output.t["catalog.items.form.scanCode.label"])}
    centerElement: true
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["catalog.items.form.scanCode.scan.aria"]}
# The edits survive a restart.
- runFlow:
    file: ../../subflows/reopen.yaml
    env:
      ROUTE: settings/items
      TEXT: ${output.t["catalog.items.title"]}
- tapOn: Espresso
- extendedWaitUntil:
    visible: ${output.t["catalog.items.form.title.edit"]}
    timeout: 10000
- assertVisible:
    id: ${output.re(output.t["catalog.items.form.name.label"])}
    text: Espresso
- assertVisible: EUR
- scrollUntilVisible:
    element:
      id: ${output.re(output.t["catalog.items.form.scanCode.label"])}
    centerElement: true
- assertNotVisible:
    id: ${output.re(output.t["catalog.items.form.sku.label"])}
    text: COF-001
- assertVisible:
    id: ${output.re(output.t["catalog.items.form.scanCode.label"])}
    text: "8594001234567"
# Delete it; the list is empty again.
- scrollUntilVisible:
    element: ${output.t["catalog.items.delete"]}
- tapOn: ${output.t["catalog.items.delete"]}
- tapOn: ${output.t["catalog.items.delete.confirm.confirm"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.items.empty.title"]}
    timeout: 10000
