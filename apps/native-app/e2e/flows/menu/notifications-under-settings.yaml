# web menu.spec.ts: "the bell on home opens Notifications, which has Back and
# no bar" — on native Notifications sit under Settings (navigation/0002), a
# sub-screen with Back and no bar, and home has no bell.
appId: ${APP_ID}
tags: [menu]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.notifications"]}
      HIDDEN: "true"
- runFlow:
    file: ../../subflows/open-settings-entry.yaml
    env:
      TITLE: ${output.t["notifications.title"]}
      FROM_HOME: "true"
- extendedWaitUntil:
    visible: ${output.t["notifications.empty.title"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.home"]}
      HIDDEN: "true"
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.home"]}
