# web menu.spec.ts: "the bell on home opens Notifications, which has Back and
# no bar" — on native Notifications are a tab of the menu (navigation/0004),
# a root screen with the bar and no Back, and home has no bell.
appId: ${APP_ID}
tags: [menu]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow:
    file: ../../subflows/open-menu-tab.yaml
    env:
      TAB: ${output.t["nav.notifications"]}
- extendedWaitUntil:
    visible: ${output.t["notifications.empty.title"]}
    timeout: 15000
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.back"]}
      HIDDEN: "true"
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["nav.home"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["nav.menu"]}
