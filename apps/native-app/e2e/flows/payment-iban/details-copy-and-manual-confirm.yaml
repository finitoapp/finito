# web payment-iban.spec.ts: "pay with IBAN: bank details stay hidden until
# toggled, show the IBAN grouped in fours, and let the IBAN/VS be copied and
# the transfer confirmed manually" — Finito shows them in a dialog, without copying.
appId: ${APP_ID}
tags: [payment-iban]
---
- runFlow: ../../subflows/seed-onboarding.yaml
- runFlow: ../../subflows/to-tip-step.yaml
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.method.iban"]}
- runFlow:
    file: ../../subflows/assert-label.yaml
    env:
      LABEL: ${output.t["paymentWait.copyQr"]}
# Finito keeps the details behind "More information", in a dialog: the
# Czech account number rather than the IBAN, nothing to copy.
- assertNotVisible: 19-2000145399/0800
- runFlow:
    file: ../../subflows/scroll-to-label.yaml
    env:
      LABEL: ${output.t["paymentWait.ibanDetails.more"]}
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.ibanDetails.more"]}
- extendedWaitUntil:
    visible: 19-2000145399/0800
    timeout: 10000
- assertVisible: ${output.t["paymentWait.ibanDetails.variableSymbol.label"]}
- assertVisible: ${output.t["paymentWait.cancel"]}
# Closing the dialog hides the details again.
- runFlow:
    file: ../../subflows/tap-label.yaml
    env:
      LABEL: ${output.t["dialog.close"]}
- extendedWaitUntil:
    notVisible: 19-2000145399/0800
    timeout: 10000
# Manual confirmation.
- scrollUntilVisible:
    element: ${output.t["paymentWait.ibanPaid.action"]}
- tapOn: ${output.t["paymentWait.ibanPaid.action"]}
- extendedWaitUntil:
    visible:
      id: payment-paid-panel
    timeout: 15000
- assertVisible: ${output.t["paymentWait.paid"]}
