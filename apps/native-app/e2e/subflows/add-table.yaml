# web's addTable: adds a table (NAME, optional SEATS) through the settings
# form and ends on the tables list. Without SEATS the seat count is left
# empty: a table without seats (catalog/0008).
appId: ${APP_ID}
---
- runFlow:
    file: goto.yaml
    env:
      ROUTE: settings/tables
      TEXT: ${output.t["catalog.tables.title"]}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["catalog.tables.add"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.tables.form.title.create"]}
    timeout: 15000
- runFlow:
    file: type-input.yaml
    env:
      LABEL: ${output.t["catalog.tables.form.name.label"]}
      VALUE: ${NAME}
- runFlow:
    when:
      true: ${typeof SEATS !== "undefined"}
    file: type-input.yaml
    env:
      LABEL: ${output.t["catalog.tables.form.seatCount.label"]}
      VALUE: '${typeof SEATS === "undefined" ? "" : SEATS}'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# The Save button shares its copy with the page title.
- tapOn:
    text: ${output.re(output.t["catalog.tables.form.save.create"])}
    below:
      id: ${output.re(output.t["catalog.tables.form.seatCount.label"])}
- extendedWaitUntil:
    visible: ${output.t["catalog.tables.title"]}
    timeout: 15000
