# From the home after enable-card: 5.90 with no tip, then the "Payment card"
# tab, whose tap launches the fake SwitchioPay by itself (payment/0033). The
# caller asserts the outcome (the paid panel when the scenario approves).
appId: ${APP_ID}
---
- runFlow: to-tip-step.yaml
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.method.card"]}
