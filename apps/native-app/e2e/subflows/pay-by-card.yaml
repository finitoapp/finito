# From the home after enable-card: 5.90 with no tip, the "Payment card" tab
# and its pay button, which launches the fake SwitchioPay. The caller asserts
# the outcome (the paid panel when the scenario approves).
appId: ${APP_ID}
---
- runFlow: to-tip-step.yaml
- tapOn: ${output.re(output.t["paymentTip.none"])}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.method.card"]}
- runFlow:
    file: assert-label.yaml
    env:
      LABEL: ${output.t["paymentWait.cardPaid.action"]}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["paymentWait.cardPaid.action"]}
