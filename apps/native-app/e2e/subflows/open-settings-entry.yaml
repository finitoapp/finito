# web's openSettingsEntry: taps the Settings list entry TITLE in-app (no
# reload). FROM_HOME: "true" first opens Settings from home through the menu
# (web's openMenuTabFromHome): the hamburger, then the Settings tab.
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof FROM_HOME !== "undefined" && FROM_HOME === "true"}
    commands:
      - runFlow:
          file: open-menu-tab.yaml
          env:
            TAB: ${output.t["nav.settings"]}
      - extendedWaitUntil:
          visible: ${output.t["settings.title"]}
          timeout: 15000
# The list keeps its scroll position: back to its top first.
- runFlow:
    when:
      notVisible: ${output.t["settings.title"]}
    commands:
      - scrollUntilVisible:
          element: ${output.t["settings.title"]}
          direction: UP
- scrollUntilVisible:
    element: ${output.re(TITLE)}
    centerElement: true
- tapOn: ${output.re(TITLE)}
