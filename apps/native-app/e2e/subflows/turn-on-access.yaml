# web's turnOnAccessControl: Settings → Access and its wizard, PIN (default
# 4821) as the owner PIN, optional PRESET (an access.preset.* key's text, e.g.
# "None") for this device. Turning it on starts a PIN session on the Access
# page, as web's helper leaves it: KEEP: "true" stays there with it; otherwise
# the app restarts to end the session, which web's specs do with a reload.
# IN_APP: "true" opens Access from the terminal home through Settings
# (web's `navigate: false` after opening it in-app), so nothing reloads.
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${typeof IN_APP === "undefined" || IN_APP !== "true"}
    file: goto.yaml
    env:
      ROUTE: settings/access
      TEXT: ${output.t["access.title"]}
- runFlow:
    when:
      true: ${typeof IN_APP !== "undefined" && IN_APP === "true"}
    file: open-settings-entry.yaml
    env:
      FROM_HOME: "true"
      TITLE: ${output.t["access.title"]}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["access.turnOn"]}
- runFlow:
    file: tap-input.yaml
    env:
      LABEL: ${output.t["access.newPin.label"]}
- inputText: '${typeof PIN === "undefined" ? "4821" : PIN}'
- runFlow:
    file: tap-input.yaml
    env:
      LABEL: ${output.t["access.newPin.repeat"]}
- inputText: '${typeof PIN === "undefined" ? "4821" : PIN}'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["access.wizard.next"]}
- extendedWaitUntil:
    visible: ${output.t["access.device.this"]}
    timeout: 15000
- runFlow:
    when:
      true: ${typeof PRESET !== "undefined"}
    commands:
      # This device's select: other devices have one too.
      - tapOn:
          text: ${output.re(output.t["access.preset.basic"])}
          below: ${output.t["access.device.this"]}
      - tapOn: '${typeof PRESET === "undefined" ? "" : output.re(PRESET)}'
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["access.turnOn"]}
- extendedWaitUntil:
    visible: ${output.t["access.status.on"]}
    timeout: 15000
- runFlow:
    when:
      true: ${typeof KEEP === "undefined" || KEEP !== "true"}
    file: relaunch.yaml
    env:
      TEXT: ${output.re(output.t["home.pay"])}|${output.re(output.t["bill.table.dialog.none"])}|This screen needs .*
