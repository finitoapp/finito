# From the terminal home, in-app (a PIN session survives): home's switch to
# Sales (navigation/0004), the tables-and-bills grid that is web's pos mode,
# and waits for its "no table" strip. Home remembers the mode, so it may
# already show the grid.
appId: ${APP_ID}
---
- runFlow:
    when:
      notVisible: ${output.t["bill.table.dialog.none"]}
    commands:
      - runFlow:
          file: tap-label.yaml
          env:
            LABEL: ${output.t["nav.pos"]}
- extendedWaitUntil:
    visible: ${output.t["bill.table.dialog.none"]}
    timeout: 15000
