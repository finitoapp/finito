# web's addCatalogCategory: adds a category (NAME) through the settings form
# and ends on the categories list.
appId: ${APP_ID}
---
- runFlow:
    file: goto.yaml
    env:
      ROUTE: catalog/categories
      TEXT: ${output.t["catalog.categories.title"]}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["catalog.categories.add"]}
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.form.title.create"]}
    timeout: 15000
- runFlow:
    file: type-input.yaml
    env:
      LABEL: ${output.t["catalog.categories.form.name.label"]}
      VALUE: ${NAME}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# The Save button shares its copy with the page title.
- tapOn:
    text: ${output.re(output.t["catalog.categories.form.save.create"])}
    below:
      id: ${output.re(output.t["catalog.categories.form.name.label"])}
- extendedWaitUntil:
    visible: ${output.t["catalog.categories.title"]}
    timeout: 15000
