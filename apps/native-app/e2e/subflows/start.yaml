# A fresh app with the strings loaded: the first step of every flow. Waits for
# onboarding, which a fresh app opens on: a link opened before the app is up
# is lost on Android.
appId: ${APP_ID}
---
- runScript: ../.generated/strings.js
- clearState
- runFlow: launch.yaml
- extendedWaitUntil:
    visible: ${output.t["onboarding.welcome.new"]}
    timeout: 30000
