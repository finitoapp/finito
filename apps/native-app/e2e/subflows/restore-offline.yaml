# web onboarding's "submit a recovery phrase and go offline": from a fresh
# start, a phrase no relay knows (the `unregisteredMnemonic` action, kept as
# output.phrase), the device read as offline (the `offline` action: Maestro
# cannot take web offline), then Restore on onboarding, which lands on the
# failed restore sync with the offline explanation.
appId: ${APP_ID}
---
- runFlow:
    file: e2e-action.yaml
    env:
      ACTION: unregisteredMnemonic
- copyTextFrom:
    id: e2e-result
- evalScript: '${output.phrase = maestro.copiedText.replace(/^E2E OK unregisteredMnemonic /, "")}'
# In-app after the action: on web a link would reload and forget it.
- runFlow:
    file: goto.yaml
    env:
      ROUTE: e2e/offline?next=/onboarding
      TEXT: ${output.t["onboarding.welcome.new"]}
- tapOn: ${output.t["onboarding.welcome.restore"]}
# One word per field: Maestro types into the element it tapped, so a space
# would not move on to the next field as it does for a person.
- evalScript: '${output.words = output.phrase.split(" "); output.slot = 0}'
- repeat:
    times: 20
    commands:
      - scrollUntilVisible:
          element:
            id: '${output.t["onboarding.restore.wordLabel"].replace("{index}", String(output.slot + 1))}'
      - tapOn:
          id: '${output.t["onboarding.restore.wordLabel"].replace("{index}", String(output.slot + 1))}'
      - inputText: '${output.words[output.slot]}'
      - evalScript: '${output.slot = output.slot + 1}'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
# The button sits below the 20 word fields.
- runFlow:
    file: scroll-to-label.yaml
    env:
      LABEL: ${output.t["onboarding.restore.action"]}
- runFlow:
    file: tap-label.yaml
    env:
      LABEL: ${output.t["onboarding.restore.action"]}
- extendedWaitUntil:
    visible: ${output.t["accountRestore.failed.title"]}
    timeout: 30000
- assertVisible: ${output.t["accountRestore.failed.offline"]}
