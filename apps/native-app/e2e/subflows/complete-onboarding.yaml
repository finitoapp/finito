# web's completeOnboarding: the real onboarding UI from a fresh app (run
# start.yaml first): a new account with the default Czech bank account, ending
# on the terminal home.
appId: ${APP_ID}
---
- tapOn: ${output.t["onboarding.welcome.new"]}
- runFlow:
    file: fill-input.yaml
    env:
      LABEL: ${output.t["onboarding.setup.account.label"]}
      VALUE: CZ6508000000192000145399
- runFlow: sell-and-finish.yaml
- extendedWaitUntil:
    visible: ${output.t["home.pay"]}
    timeout: 30000
